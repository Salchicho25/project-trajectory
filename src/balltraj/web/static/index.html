<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trajectoire</title>
  <meta name="description" content="Simulateur de trajectoire de balle : traînée, effet Magnus, rotation, vent et altitude.">
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/barlow-semicondensed-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/libre-caslon-display-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/libre-caslon-text-700.woff2" as="font" type="font/woff2" crossorigin>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="rail">
    <h1 class="mark">Trajectoire</h1>
    <div class="tabs" id="tabs" role="tablist" aria-label="Situations"></div>
    <label class="ball-pick">
      <span>Balle</span>
      <select id="ball"></select>
    </label>
  </header>

  <main id="panel" class="layout" role="tabpanel">
    <form id="controls" class="controls" aria-label="Réglages du tir" autocomplete="off">
      <div id="groups"></div>
      <div class="dock">
        <div class="actions">
          <button type="button" id="btn-optimal">Portée maximale</button>
          <button type="button" id="btn-target" class="primary">Viser la cible</button>
          <button type="button" id="btn-reset" class="quiet">Réglages d'origine</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </form>

    <section class="sheet" id="sheet" data-view="2d" aria-label="Relevé de la trajectoire">
      <p id="verdict" class="verdict" data-state="neutral" role="status" aria-live="polite"></p>
      <div class="toggles">
        <div class="views" role="group" aria-label="Type de vue">
          <button type="button" id="v-2d" aria-pressed="true">Relevé</button>
          <button type="button" id="v-3d" aria-pressed="false">Vue 3D</button>
        </div>
        <label><input type="checkbox" id="t-vacuum" checked> Parabole sans air</label>
        <label><input type="checkbox" id="t-nospin" checked> Même tir sans rotation</label>
        <label><input type="checkbox" id="t-forces" checked> Forces à l'apogée</label>
      </div>
      <figure class="plot plot-side">
        <figcaption>Vue de côté</figcaption>
        <canvas id="cv-side" role="img" aria-label="Trajectoire en vue de côté"></canvas>
      </figure>
      <figure class="plot plot-top">
        <figcaption>Vue de dessus</figcaption>
        <canvas id="cv-top" role="img" aria-label="Trajectoire en vue de dessus"></canvas>
      </figure>
      <figure class="plot plot-3d">
        <figcaption>Vue 3D</figcaption>
        <canvas id="cv-3d" role="img" aria-label="Vue 3D de la trajectoire, rejouée en temps réel"></canvas>
        <dl class="hud" aria-hidden="true">
          <div><dt>Temps</dt><dd id="h-time">0,00 s</dd></div>
          <div><dt>Distance</dt><dd id="h-dist">0,0 m</dd></div>
          <div><dt>Hauteur</dt><dd id="h-height">0,00 m</dd></div>
          <div><dt>Vitesse</dt><dd><span id="h-speed">0 m/s</span> <small id="h-kmh">0 km/h</small></dd></div>
        </dl>
        <p id="msg-3d" class="msg-3d" role="status"></p>
        <div class="deck">
          <button type="button" id="b-play" aria-pressed="true">Pause</button>
          <input type="range" id="r-time" min="0" max="1000" step="1" value="0" aria-label="Position dans le tir">
          <output id="o-time" for="r-time">0,00 / 0,00 s</output>
          <label class="deck-speed">Vitesse
            <select id="s-speed" aria-label="Vitesse de lecture">
              <option value="0.1">0,1×</option>
              <option value="0.25">0,25×</option>
              <option value="0.5">0,5×</option>
              <option value="1" selected>1× temps réel</option>
              <option value="2">2×</option>
            </select>
          </label>
          <label class="deck-loop"><input type="checkbox" id="t-loop" checked> Boucle</label>
          <div class="deck-tools" role="group" aria-label="Capture">
            <button type="button" id="b-photo">Photo</button>
            <button type="button" id="b-video">Vidéo</button>
          </div>
          <div class="cams" role="group" aria-label="Caméra">
            <button type="button" id="c-cine" aria-pressed="false">Cinéma</button>
            <button type="button" id="c-suivi" aria-pressed="false">Suivi</button>
            <button type="button" id="c-tribune" aria-pressed="true">Tribune</button>
            <button type="button" id="c-aerien" aria-pressed="false">Aérien</button>
            <button type="button" id="c-arrivee" aria-pressed="false">Arrivée</button>
          </div>
        </div>
      </figure>
    </section>

    <aside class="results" aria-label="Résultats">
      <table class="data">
        <caption>Résultats du tir</caption>
        <tbody id="rows-main"></tbody>
        <tbody id="rows-compare"></tbody>
        <tbody id="rows-aero"></tbody>
      </table>
      <figure class="plot plot-chart">
        <figcaption>Vitesse, Cd et CL pendant le vol</figcaption>
        <canvas id="cv-chart" role="img" aria-label="Vitesse, coefficient de traînée et de portance en fonction du temps"></canvas>
      </figure>
      <p id="air" class="air"></p>
      <section class="export" aria-labelledby="export-title">
        <h2 id="export-title">Exporter vers Fusion</h2>
        <p>Script prêt à lancer dans Autodesk Fusion : la balle à chaque instant, les courbes de profil et de dessus, les points de contact.</p>
        <div class="export-actions">
          <button type="button" id="btn-fusion" class="primary">Script Fusion (.zip)</button>
          <button type="button" id="btn-csv">Données (.csv)</button>
          <button type="button" id="btn-link">Copier le lien de ce tir</button>
        </div>
        <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
      </section>
    </aside>
  </main>

  <p id="error" class="error" role="alert" hidden></p>
  <noscript><p class="error">Cette interface a besoin de JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
