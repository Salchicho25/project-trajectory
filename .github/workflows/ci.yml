name: CI

on:
  push:
  pull_request:

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Formatage (ruff format)
        run: ruff format --check .
      - name: Typage (mypy)
        run: mypy
      - name: Tests (tous, y compris les lents) + couverture
        run: pytest -m "" --cov --cov-report=term --cov-fail-under=90
